name: Apply reviewed PR 87 hardening
on:
  push:
    branches: [audit/analyze-job-recovery]
    paths: [.github/workflows/apply-pr87-hardening.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch and remove bootstrap
        run: |
          curl --fail --silent --show-error --location https://paste.rs/ou8A5 -o /tmp/pr87.patch
          echo 'a37036dc2fddf929fde97635431bfa2bc29b4b03ef58a0a5ccf31a746e5d5d9c  /tmp/pr87.patch' | sha256sum --check
          git apply --index /tmp/pr87.patch
          git rm .github/workflows/apply-pr87-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(worker): harden durable recovery and close CI gaps'
          git push
