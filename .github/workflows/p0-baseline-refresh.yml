name: One-shot baseline refresh

on:
  push:
    branches:
      - fix/p0-atomic-review-export-20260909

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: p0-baseline-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/p0-atomic-review-export-20260909
          fetch-depth: 0

      - name: Verify attested gate evidence for this source tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git diff --name-only 2dcc84d482c3802b79cffc382f5a877da631f2d2..HEAD > /tmp/tree-diff.txt
          echo "changed since the attested CI run:"
          cat /tmp/tree-diff.txt
          if grep -v '^\.github/workflows/' /tmp/tree-diff.txt | grep -q .; then
            echo "source tree changed outside .github/workflows since the attested run; refusing to mint"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/34443168121/jobs?per_page=100" \
            --jq '.jobs[] | "\(.name)=\(.conclusion)"' | sort > /tmp/gate-jobs.txt
          cat /tmp/gate-jobs.txt
          for gate in test frontend supply-chain-audit sprint-2-1-gates security-regression offline-bundle-smoke openapi-contract; do
            grep -qx "$gate=success" /tmp/gate-jobs.txt || { echo "gate $gate is not success in run 34443168121"; exit 1; }
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        with:
          node-version: '22'

      - name: Install locked backend toolchain
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip install -e . --no-deps

      - name: Backend gates (captured, non-fatal)
        id: gates
        working-directory: backend
        run: |
          set +e
          mkdir -p var/reports
          python -m ruff format --check src tests > /tmp/ruff-format.txt 2>&1
          echo "$?" > /tmp/code-ruff-format.txt
          python -m ruff check src tests > /tmp/ruff-check.txt 2>&1
          echo "$?" > /tmp/code-ruff-check.txt
          python -m mypy src/aerobim --strict --ignore-missing-imports > /tmp/mypy.txt 2>&1
          echo "$?" > /tmp/code-mypy.txt
          python -m pytest tests -q --junitxml=var/reports/pytest-junit.xml > /tmp/pytest.txt 2>&1
          echo "$?" > /tmp/code-pytest.txt
          ok=1
          for name in ruff-format ruff-check mypy pytest; do
            code="$(cat /tmp/code-$name.txt 2>/dev/null || echo 99)"
            echo "$name=$code"
            if [ "$code" != "0" ]; then ok=0; fi
          done
          echo "backend_ok=$ok" >> "$GITHUB_OUTPUT"
          echo '--- pytest tail ---'
          tail -n 40 /tmp/pytest.txt
          exit 0

      - name: Frontend gates (captured, non-fatal)
        id: fe
        working-directory: frontend
        run: |
          set +e
          if [ "${{ steps.gates.outputs.backend_ok }}" != "1" ]; then
            echo "backend gates not green; skipping frontend gates"
            echo "frontend_ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p var
          npm ci > /tmp/npm-ci.txt 2>&1
          echo "$?" > /tmp/code-npm-ci.txt
          npx vitest run --reporter=json --outputFile=var/vitest-results.json > /tmp/vitest.txt 2>&1
          echo "$?" > /tmp/code-vitest.txt
          npm run build > /tmp/build.txt 2>&1
          echo "$?" > /tmp/code-build.txt
          ok=1
          for name in npm-ci vitest build; do
            code="$(cat /tmp/code-$name.txt 2>/dev/null || echo 99)"
            echo "$name=$code"
            if [ "$code" != "0" ]; then ok=0; fi
          done
          echo "frontend_ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate the CI-attested runtime baseline
        if: always()
        env:
          AEROBIM_GATES_ATTESTED: 'test,frontend,supply-chain-audit,sprint-2-1-gates,security-regression,offline-bundle-smoke,openapi-contract'
        run: |
          set +e
          python -m aerobim.tools.export_runtime_baseline --help > /tmp/help.txt 2>&1
          if [ "${{ steps.gates.outputs.backend_ok }}" != "1" ] || [ "${{ steps.fe.outputs.frontend_ok }}" != "1" ]; then
            echo "gates are not green; refusing to mint a pin" > /tmp/gen.txt
            echo "skipped" > /tmp/gen-exit.txt
            exit 0
          fi
          ARGS="--gate ruff=PASS --gate mypy=PASS --gate pytest=PASS --gate vitest=PASS --gate build=PASS"
          ARGS="$ARGS --pytest-junit backend/var/reports/pytest-junit.xml"
          ARGS="$ARGS --vitest-json frontend/var/vitest-results.json"
          grep -q -- '--require-complete' /tmp/help.txt && ARGS="$ARGS --require-complete"
          git status --porcelain > /tmp/tree-before.txt
          python -m aerobim.tools.export_runtime_baseline $ARGS > /tmp/gen.txt 2>&1
          echo "$?" > /tmp/gen-exit.txt
          tail -n 25 /tmp/gen.txt
          exit 0

      - name: Align README pins
        if: always()
        run: |
          set +e
          if [ "$(cat /tmp/gen-exit.txt 2>/dev/null || echo x)" != "0" ]; then
            echo "generation did not succeed; skipping README alignment" > /tmp/align.txt
            exit 0
          fi
          python - > /tmp/align.txt 2>&1 <<'PY'
import json
import pathlib
import subprocess

new = json.loads(pathlib.Path("docs/evidence/runtime-baseline-latest.json").read_text(encoding="utf-8"))
old_raw = subprocess.run(
    ["git", "show", "HEAD:docs/evidence/runtime-baseline-latest.json"],
    capture_output=True,
    text=True,
    check=True,
).stdout
old = json.loads(old_raw)
old_snippet = old.get("readme_snippet", "")
new_snippet = new.get("readme_snippet", "")
print("old:", old_snippet)
print("new:", new_snippet)
for name in ("README.md", "README.ru.md"):
    path = pathlib.Path(name)
    text = path.read_text(encoding="utf-8")
    if old_snippet and old_snippet in text:
        path.write_text(text.replace(old_snippet, new_snippet), encoding="utf-8")
        print(name, "replaced")
    elif new_snippet and new_snippet in text:
        print(name, "already current")
    else:
        print(name, "MISSING SNIPPET")
print("commit_sha:", new.get("commit_sha"))
print("publishable:", new.get("publishable"), "attested_by:", new.get("attested_by"))
print("metrics:", json.dumps(new.get("metrics", {}), ensure_ascii=False, sort_keys=True))
print("backend:", json.dumps(new.get("backend", {}), ensure_ascii=False, sort_keys=True))
PY
          echo "$?" > /tmp/align-exit.txt
          exit 0

      - name: Re-run repository baseline checks
        if: always()
        env:
          AEROBIM_GATES_ATTESTED: 'test,frontend,supply-chain-audit,sprint-2-1-gates,security-regression,offline-bundle-smoke,openapi-contract'
        run: |
          set +e
          if [ "$(cat /tmp/align-exit.txt 2>/dev/null || echo x)" != "0" ]; then
            echo "alignment did not run; skipping checks" > /tmp/check.txt
            exit 0
          fi
          CARGS="--out docs/evidence/runtime-baseline-latest.ci-generated.json"
          grep -q -- '--check-readme' /tmp/help.txt && CARGS="--check-readme $CARGS"
          grep -q -- '--check-complete' /tmp/help.txt && CARGS="--check-complete $CARGS"
          python -m aerobim.tools.export_runtime_baseline $CARGS > /tmp/check.txt 2>&1
          echo "$?" > /tmp/check-exit.txt
          git status --porcelain > /tmp/tree-after.txt
          tail -n 25 /tmp/check.txt
          exit 0

      - name: Commit the refreshed pin
        if: always()
        run: |
          set -euo pipefail
          gen="$(cat /tmp/gen-exit.txt 2>/dev/null || echo x)"
          chk="$(cat /tmp/check-exit.txt 2>/dev/null || echo x)"
          if [ "$gen" != "0" ] || [ "$chk" != "0" ]; then
            echo "not committing: gen=$gen check=$chk"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/runtime-baseline-latest.json README.md README.ru.md
          git rm -q .github/workflows/p0-baseline-refresh.yml
          git commit -m "chore(evidence): refresh CI-attested runtime baseline pin" -m "Minted inside GitHub Actions on a push event, never from a local run (N-26). ruff, mypy, pytest, vitest and build were re-executed in this job; test, frontend, supply-chain-audit, sprint-2-1-gates, security-regression, offline-bundle-smoke and openapi-contract are attested from run 34443168121 on this identical source tree, not re-run here. This changes evidence bookkeeping only: customer_go=false and market_go=false are unchanged."
          git push origin HEAD:fix/p0-atomic-review-export-20260909
          echo committed > /tmp/committed.txt

      - name: Comment the refresh evidence on PR 45
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          dump() {
            echo "#### $1"
            echo '```text'
            if [ -f "$2" ]; then tail -n "$3" "$2" | cut -c1-300; else echo '(missing)'; fi
            echo '```'
            echo
          }
          JLINE="$(grep -n -- '--junitxml' .github/workflows/ci.yml | head -n 1 | cut -d: -f1)"
          if [ -n "$JLINE" ]; then
            JSTART=$(( JLINE > 55 ? JLINE - 55 : 1 ))
            sed -n "${JSTART},$(( JLINE + 10 ))p" .github/workflows/ci.yml > /tmp/ci-test.txt
          else
            echo '(no --junitxml in ci.yml)' > /tmp/ci-test.txt
          fi
          VLINE="$(grep -n -- '--outputFile' .github/workflows/ci.yml | head -n 1 | cut -d: -f1)"
          if [ -n "$VLINE" ]; then
            VSTART=$(( VLINE > 40 ? VLINE - 40 : 1 ))
            sed -n "${VSTART},$(( VLINE + 10 ))p" .github/workflows/ci.yml > /tmp/ci-frontend.txt
          else
            echo '(no --outputFile in ci.yml)' > /tmp/ci-frontend.txt
          fi
          {
            echo '## Runtime baseline refresh (one-shot, in CI) — attempt 2'
            echo
            echo "backend_ok=${{ steps.gates.outputs.backend_ok }} frontend_ok=${{ steps.fe.outputs.frontend_ok }}"
            echo
            echo "exit codes: ruff-format=$(cat /tmp/code-ruff-format.txt 2>/dev/null || echo -) ruff-check=$(cat /tmp/code-ruff-check.txt 2>/dev/null || echo -) mypy=$(cat /tmp/code-mypy.txt 2>/dev/null || echo -) pytest=$(cat /tmp/code-pytest.txt 2>/dev/null || echo -) npm-ci=$(cat /tmp/code-npm-ci.txt 2>/dev/null || echo -) vitest=$(cat /tmp/code-vitest.txt 2>/dev/null || echo -) build=$(cat /tmp/code-build.txt 2>/dev/null || echo -) gen=$(cat /tmp/gen-exit.txt 2>/dev/null || echo -) check=$(cat /tmp/check-exit.txt 2>/dev/null || echo -) committed=$(test -f /tmp/committed.txt && echo yes || echo no)"
            echo
            dump 'pytest tail' /tmp/pytest.txt 60
            dump 'mypy tail' /tmp/mypy.txt 12
            dump 'ruff format tail' /tmp/ruff-format.txt 8
            dump 'ruff check tail' /tmp/ruff-check.txt 8
            dump 'vitest tail' /tmp/vitest.txt 12
            dump 'build tail' /tmp/build.txt 12
            dump 'generation tail' /tmp/gen.txt 40
            dump 'README alignment' /tmp/align.txt 25
            dump 'post-alignment checks' /tmp/check.txt 25
            dump 'working tree after checks' /tmp/tree-after.txt 20
            dump 'CLI surface' /tmp/help.txt 70
            echo '#### ci.yml window around --junitxml'
            echo '```yaml'
            cat /tmp/ci-test.txt
            echo '```'
            echo
            echo '#### ci.yml window around vitest --outputFile'
            echo '```yaml'
            cat /tmp/ci-frontend.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment 45 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          exit 0

      - name: Fail if the pin was not refreshed
        if: always()
        run: |
          if [ ! -f /tmp/committed.txt ]; then
            echo 'runtime baseline pin was not refreshed; see the PR comment for gate output'
            exit 1
          fi
          echo 'runtime baseline pin refreshed'
