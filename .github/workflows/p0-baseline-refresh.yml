name: One-shot baseline refresh

on:
  push:
    branches:
      - fix/p0-atomic-review-export-20260909

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: p0-baseline-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GATE_RUN_ID: "34443168121"
      GATE_TREE_REF: "2dcc84d482c3802b79cffc382f5a877da631f2d2"
      AEROBIM_GATES_ATTESTED: "test,frontend,supply-chain-audit,sprint-2-1-gates,security-regression,offline-bundle-smoke,openapi-contract"
    steps:
      - name: Checkout branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/p0-atomic-review-export-20260909
          fetch-depth: 0
      - name: Verify attested gate evidence for this source tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git diff --name-only "$GATE_TREE_REF..HEAD" > /tmp/tree-diff.txt
          echo "== paths changed since $GATE_TREE_REF =="
          cat /tmp/tree-diff.txt
          if grep -v '^\.github/workflows/' /tmp/tree-diff.txt | grep -q .; then
            echo "source tree changed outside .github/workflows since the attested run" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GATE_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | "\(.name)=\(.conclusion)"' | sort > /tmp/gate-jobs.txt
          cat /tmp/gate-jobs.txt
          for gate in test frontend supply-chain-audit sprint-2-1-gates security-regression offline-bundle-smoke openapi-contract; do
            grep -qx "$gate=success" /tmp/gate-jobs.txt || { echo "gate $gate is not success in run $GATE_RUN_ID" >&2; exit 1; }
          done
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        with:
          node-version: "22"
      - name: Install locked backend toolchain
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip install -e . --no-deps
      - name: Backend gates (ruff, mypy, pytest JUnit)
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p var/reports
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m mypy src/aerobim --strict --ignore-missing-imports
          python -m pytest tests -q --junitxml=var/reports/pytest-junit.xml
      - name: Frontend gates (vitest JSON, build)
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p var
          npm ci
          npx vitest run --reporter=json --outputFile=var/vitest-results.json
          npm run build
      - name: Generate the CI-attested runtime baseline
        run: |
          set +e
          python -m aerobim.tools.export_runtime_baseline --help > /tmp/help.txt 2>&1
          echo "help_exit=$?"
          git status --porcelain > /tmp/tree-before.txt
          echo "== working tree before generation =="
          cat /tmp/tree-before.txt
          python -m aerobim.tools.export_runtime_baseline \
            --gate ruff=PASS \
            --gate mypy=PASS \
            --gate pytest=PASS \
            --gate vitest=PASS \
            --gate build=PASS \
            --pytest-junit backend/var/reports/pytest-junit.xml \
            --vitest-json frontend/var/vitest-results.json \
            --require-complete > /tmp/gen.txt 2>&1
          echo "$?" > /tmp/gen-exit.txt
          echo "gen_exit=$(cat /tmp/gen-exit.txt)"
          tail -n 25 /tmp/gen.txt
          git status --porcelain > /tmp/tree-after.txt
          echo "== working tree after generation =="
          cat /tmp/tree-after.txt
      - name: Align README pins and re-run repository baseline checks
        run: |
          set +e
          if [ "$(cat /tmp/gen-exit.txt)" != "0" ]; then
            echo "generation failed; skipping README alignment" | tee /tmp/align.txt
            echo "99" > /tmp/check-readme-exit.txt
            exit 0
          fi
          python3 - <<'PY' > /tmp/align.txt 2>&1
          import json
          import pathlib
          import subprocess

          new = json.loads(
              pathlib.Path("docs/evidence/runtime-baseline-latest.json").read_text(encoding="utf-8")
          )
          old = json.loads(
              subprocess.run(
                  ["git", "show", "HEAD:docs/evidence/runtime-baseline-latest.json"],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout
          )
          print("commit_sha", new.get("commit_sha"))
          print("tree_sha", new.get("tree_sha"))
          print("publishable", new.get("publishable"))
          print("artifact_completeness", new.get("artifact_completeness"))
          print("working_tree_clean", new.get("working_tree_clean"))
          print("metrics", json.dumps(new.get("metrics"), ensure_ascii=False))
          backend = new.get("backend") or {}
          print(
              "backend",
              json.dumps(
                  {
                      key: backend.get(key)
                      for key in (
                          "tests_collected",
                          "tests_passed",
                          "tests_skipped",
                          "tests_failed",
                          "tests_unaccounted",
                          "source_loc",
                          "test_loc",
                          "test_functions",
                      )
                  },
                  ensure_ascii=False,
              ),
          )
          print("frontend", json.dumps(new.get("frontend"), ensure_ascii=False))
          old_snippet = old["readme_snippet"]
          new_snippet = new["readme_snippet"]
          print("old_snippet", old_snippet)
          print("new_snippet", new_snippet)
          if new.get("publishable") is not True:
              raise SystemExit("generated baseline is not publishable; refusing to align README")
          for name in ("README.md", "README.ru.md"):
              path = pathlib.Path(name)
              text = path.read_text(encoding="utf-8")
              if old_snippet not in text:
                  raise SystemExit(f"old snippet missing in {name}")
              path.write_text(text.replace(old_snippet, new_snippet), encoding="utf-8")
              print("aligned", name)
          PY
          align_exit=$?
          echo "align_exit=$align_exit" >> /tmp/align.txt
          cat /tmp/align.txt
          if [ "$align_exit" != "0" ]; then
            echo "$align_exit" > /tmp/check-readme-exit.txt
            exit 0
          fi
          python -m aerobim.tools.export_runtime_baseline \
            --check-readme \
            --check-complete \
            --gate ruff=PASS \
            --gate mypy=PASS \
            --gate pytest=PASS \
            --gate vitest=PASS \
            --gate build=PASS \
            --pytest-junit backend/var/reports/pytest-junit.xml \
            --vitest-json frontend/var/vitest-results.json \
            --out docs/evidence/runtime-baseline-latest.ci-generated.json > /tmp/check-readme.txt 2>&1
          echo "$?" > /tmp/check-readme-exit.txt
          echo "check_readme_exit=$(cat /tmp/check-readme-exit.txt)"
          tail -n 25 /tmp/check-readme.txt
      - name: Commit the refreshed pin
        run: |
          set -euo pipefail
          gen_exit="$(cat /tmp/gen-exit.txt)"
          check_exit="$(cat /tmp/check-readme-exit.txt 2>/dev/null || echo 99)"
          if [ "$gen_exit" != "0" ] || [ "$check_exit" != "0" ]; then
            echo "not committing: gen_exit=$gen_exit check_readme_exit=$check_exit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/runtime-baseline-latest.json README.md README.ru.md
          git rm .github/workflows/p0-baseline-refresh.yml
          git commit -m "chore(evidence): re-mint the CI-attested runtime baseline pin" -m "Minted by GitHub Actions on the branch tip after ruff, mypy, pytest, vitest and the frontend build ran in this job, and after run ${GATE_RUN_ID} was verified green for test, frontend, supply-chain-audit, sprint-2-1-gates, security-regression, offline-bundle-smoke and openapi-contract on the same source tree. README.md and README.ru.md snippets moved with the pin."
          git push origin HEAD:fix/p0-atomic-review-export-20260909
          echo "committed=$(git rev-parse HEAD)"
      - name: Comment the refresh evidence on PR 45
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "## Runtime baseline refresh (one-shot, in CI)"
            echo
            echo "gen_exit=$(cat /tmp/gen-exit.txt 2>/dev/null || echo missing) check_readme_exit=$(cat /tmp/check-readme-exit.txt 2>/dev/null || echo missing)"
            echo
            echo "### Alignment and artifact fields"
            echo '```text'
            head -c 6000 /tmp/align.txt 2>/dev/null
            echo '```'
            echo
            echo "### Repository baseline checks after alignment"
            echo '```text'
            tail -c 4000 /tmp/check-readme.txt 2>/dev/null
            echo '```'
            echo
            echo "### Generation tail"
            echo '```text'
            tail -c 4000 /tmp/gen.txt 2>/dev/null
            echo '```'
            echo
            echo "### Attested gates verified for this tree"
            echo '```text'
            head -c 3000 /tmp/gate-jobs.txt 2>/dev/null
            echo '```'
            echo
            echo "### CLI surface"
            echo '```text'
            head -c 4000 /tmp/help.txt 2>/dev/null
            echo '```'
          } > /tmp/refresh-comment.md
          head -c 60000 /tmp/refresh-comment.md > /tmp/refresh-comment-trimmed.md
          mv /tmp/refresh-comment-trimmed.md /tmp/refresh-comment.md
          wc -c /tmp/refresh-comment.md
          gh pr comment 45 --repo "$GITHUB_REPOSITORY" --body-file /tmp/refresh-comment.md
