name: One-shot P0 branch formatter

on:
  push:
    branches:
      - "fix/p0-atomic-review-export-20260909"

permissions:
  contents: write

jobs:
  format-and-report-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/p0-atomic-review-export-20260909
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked toolchain
        working-directory: backend
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip install -e . --no-deps
      - name: Apply repository formatter
        working-directory: backend
        run: |
          python -m ruff format \
            src/aerobim/tools/build_customer_review_pack.py \
            tests/test_build_customer_review_pack.py
      - name: Record strict mypy diagnostics
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m mypy src/aerobim/tools/build_customer_review_pack.py \
            --strict --ignore-missing-imports > /tmp/p0-mypy.txt 2>&1
          status=$?
          {
            echo "## One-shot strict mypy diagnostics (exit ${status})"
            echo '```text'
            cat /tmp/p0-mypy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Commit formatted files and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-format-p0.yml
          git add backend/src/aerobim/tools/build_customer_review_pack.py \
            backend/tests/test_build_customer_review_pack.py
          git commit -m "style: apply Ruff format to customer review pack"
          git push origin HEAD:fix/p0-atomic-review-export-20260909
