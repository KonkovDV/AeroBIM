name: IFC kernel compare (0.8.5 vs 0.9)

# Same fixtures and package under both IfcOpenShell kernels on one runner
# class. Fixture-only numbers for the 0.9 migration PR; not customer evidence.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/pyproject.toml
      - backend/requirements*-lock.txt
      - backend/src/aerobim/infrastructure/adapters/ifc_file_open.py
      - scripts/ifc_kernel_compare*.py
      - .github/workflows/ifc-kernel-compare.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel: ["0.8.5", "0.9"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.2"
          pip install --require-hashes -r requirements-dev-lock.txt
          pip install -e . --no-deps
      - name: Pin the old kernel for the baseline leg
        if: matrix.kernel == '0.8.5'
        run: pip install --no-deps "ifcopenshell==0.8.5" "ifctester==0.8.5"
      - name: Measure
        run: |
          set -euo pipefail
          python -c "import ifcopenshell; print(ifcopenshell.version)"
          python ../scripts/ifc_kernel_compare.py \
            --pack samples/benchmarks/project-package-sla-representative.json \
            --out ../kernel-${{ matrix.kernel }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-${{ matrix.kernel }}
          path: kernel-${{ matrix.kernel }}.json
  compare:
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kernel-*
          merge-multiple: true
      - name: Report
        run: |
          python scripts/ifc_kernel_compare_report.py kernel-0.8.5.json kernel-0.9.json | tee -a "$GITHUB_STEP_SUMMARY" > kernel-compare.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-compare
          path: kernel-compare.md
