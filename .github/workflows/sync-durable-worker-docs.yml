name: Sync durable worker documentation
on:
  push:
    branches: [audit/analyze-job-recovery]
    paths: [.github/workflows/sync-durable-worker-docs.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact documentation replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            "README.md": [
              ("| `POST` | `/v1/analyze/project-package/submit` | Крупный комплект в фоне того же процесса |", "| `POST` | `/v1/analyze/project-package/submit` | Постановка крупного комплекта в Redis; выполнение отдельным `aerobim.worker` |"),
            ],
            "README.en.md": [
              ("| `POST` | `/v1/analyze/project-package/submit` | Queue a larger package in the same process |", "| `POST` | `/v1/analyze/project-package/submit` | Queue a larger package in Redis for the dedicated `aerobim.worker` |"),
            ],
            "docs/deployment-sizing-and-cost-2026.md": [
              ('last_updated: "2026-09-15"', 'last_updated: "2026-09-22"'),
              ("| Job runner | FastAPI `BackgroundTasks` in the API process | JOB-01; durable workers **not claimed** |", "| Job runner | Dedicated `aerobim.worker`; Redis JSON payload + `BLMOVE` ready→processing | JOB-01; at-least-once delivery with terminal ACK, lease fencing and bounded recovery |"),
              ("| IFC process isolate | Not claimed this pass | Honesty: in-process IfcOpenShell; child-process isolate is P1.7 residual |", "| IFC process isolate | Separate long-lived worker container with cgroup/namespace hardening | Not a fresh per-job sandbox; gVisor/Kata/Firecracker remains a multi-tenant residual |"),
            ],
            "docs/KNOWN_BUGS.md": [
              ("| JOB-01 | Analyze **runner** is in-process FastAPI `BackgroundTasks`. Redis stores job **records**, not execution. Same key + same payload fingerprint returns the live/succeeded job; same key + different fingerprint → HTTP 409. | Not a Shared-gate writer. Do not claim durable workers. Fingerprint is path/id identity, not file-bytes. |", "| JOB-01 | Production HTTP is producer-only; dedicated `aerobim.worker` reserves Redis JSON deliveries with `BLMOVE`, retains them until terminal ACK, and recovers expired leases. | Delivery is at-least-once, not physically exactly-once. Redis remains a single-node failure domain and the long-lived container is not a fresh per-job sandbox. |"),
            ],
            "docs/tz/TZ_ARCHITECTURE_REQUIREMENTS_2026.md": [
              ('last_updated: "2026-07-10"', 'last_updated: "2026-09-22"'),
              ("| Async jobs | In-memory snapshot in development/test only | Redis **required** outside development (`AEROBIM_REDIS_URL`) for job **records**. Submit still uses in-process FastAPI `BackgroundTasks`, not a durable worker. |", "| Async jobs | Explicit inline compatibility path in test only | Redis is **required** outside development/test for job records and the reliable ready/processing queue. Production HTTP only publishes; dedicated `aerobim.worker` executes with at-least-once delivery, terminal ACK, lease fencing, recovery and dead-letter exhaustion. |"),
            ],
            "docs/pilot-claim-boundary-2026.md": [
              ('version: "1.13.16"', 'version: "1.13.17"'),
              ('last_updated: "2026-09-17"', 'last_updated: "2026-09-22"'),
              ("| arq/Redis async queue | Redis job store **required** outside development; in-memory is dev/test only; **submit still runs in the API process** (`BackgroundTasks`); arq/durable workers still post-pilot |", "| Redis Streams / horizontal worker scale | A dedicated Redis-backed `aerobim.worker` is implemented for production with at-least-once list delivery, terminal ACK, lease fencing and dead-letter exhaustion. Redis Streams consumer ownership, HA Redis and fresh per-job sandboxing remain post-pilot scale/isolation work |"),
            ],
            ".github/SECURITY.md": [
              ("- Redis (`AEROBIM_REDIS_URL`) is **required** outside development/test (durable analyze **job records** + shared rate limiter). The analyze **runner** is still in-process FastAPI `BackgroundTasks` (JOB-01). In-memory job store and in-process limiter are development/test only. Production compose interpolates `AEROBIM_REDIS_PASSWORD` into the URL and Redis `--requirepass`. Redis/Postgres URLs are SSRF-gated at settings load; RFC1918 datastore peers are allowed, metadata/link-local are not. Postgres→FS fallback is fail-closed under `audit_fail_closed` / hard profiles.", "- Redis (`AEROBIM_REDIS_URL`) is **required** outside development/test for durable analyze job records, the reliable ready/processing queue, and shared rate limiting. Production HTTP is producer-only; dedicated `aerobim.worker` reserves JSON deliveries with `BLMOVE`, retains them until terminal ACK, and uses lease/CAS fencing plus bounded recovery. Delivery is at-least-once; Redis remains a single-node failure domain. In-memory job execution and rate limiting are development/test only. Production compose interpolates `AEROBIM_REDIS_PASSWORD` into the URL and Redis `--requirepass`. Redis/Postgres URLs are SSRF-gated at settings load; RFC1918 datastore peers are allowed, metadata/link-local are not. Postgres→FS fallback is fail-closed under `audit_fail_closed` / hard profiles."),
            ],
            "docs/evidence/README.md": [
              ('version: "2.5.20"', 'version: "2.5.21"'),
              ('last_updated: "2026-09-15"', 'last_updated: "2026-09-22"'),
              ("| [`data-residency-inventory-latest.json`](data-residency-inventory-latest.json) | Storage surfaces + JOB-01 in-process BackgroundTasks; durable workers not claimed |", "| [`data-residency-inventory-latest.json`](data-residency-inventory-latest.json) | Storage surfaces + JOB-01 dedicated Redis worker; at-least-once delivery, not a fresh per-job sandbox or HA claim |"),
            ],
            "backend/src/aerobim/domain/analyze_job_idempotency.py": [
              ("an SLA. JOB-01 runner remains in-process BackgroundTasks.", "an SLA. Production JOB-01 execution is handled by the dedicated durable worker."),
            ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected one match, found {count}: {old[:80]!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/sync-durable-worker-docs.yml
          git add README.md README.en.md docs .github/SECURITY.md backend/src/aerobim/domain/analyze_job_idempotency.py
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(worker): remove stale in-process execution claims'
          git push
