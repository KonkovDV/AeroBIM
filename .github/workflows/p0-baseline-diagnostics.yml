name: One-shot baseline diagnostics

on:
  push:
    branches:
      - fix/p0-atomic-review-export-20260909

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/p0-atomic-review-export-20260909
          fetch-depth: 0
      - name: Fetch failed baseline-integrity job log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh run view --repo "$GITHUB_REPOSITORY" --job 102763422800 --log > /tmp/job.log 2>/tmp/job.err
          echo "gh_exit=$?"
          wc -c /tmp/job.log /tmp/job.err || true
      - name: Build diagnostics comment
        run: |
          set +e
          SRC_LOC=$(find backend/src/aerobim -name '*.py' -type f -exec cat {} + | wc -l)
          TEST_LOC=$(find backend/tests -name '*.py' -type f -exec cat {} + | wc -l)
          {
            echo "## baseline-integrity diagnostics (job 102763422800, head 2dcc84d4)"
            echo
            echo "### Failing step log tail"
            echo '```text'
            awk '/Generate CI runtime baseline/{seen=1} seen' /tmp/job.log | tail -n 140 | cut -c1-500
            echo '```'
            echo
            echo "### gh stderr"
            echo '```text'
            head -c 1500 /tmp/job.err
            echo '```'
            echo
            echo "### Committed baseline vs live LOC"
            echo '```text'
            echo "live_backend_src_loc=$SRC_LOC"
            echo "live_backend_test_loc=$TEST_LOC"
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/evidence/runtime-baseline-latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          print("artifact_commit_sha", data.get("commit_sha"))
          print("artifact_tree_sha", data.get("tree_sha"))
          print("artifact_publishable", data.get("publishable"))
          print("artifact_completeness", data.get("artifact_completeness"))
          print("artifact_metrics", json.dumps(data.get("metrics"), ensure_ascii=False))
          backend = data.get("backend") or {}
          keys = (
              "tests_collected",
              "tests_passed",
              "tests_skipped",
              "tests_failed",
              "tests_unaccounted",
              "source_loc",
              "test_loc",
              "test_functions",
          )
          print("artifact_backend", json.dumps({k: backend.get(k) for k in keys}, ensure_ascii=False))
          print("artifact_readme_snippet", data.get("readme_snippet"))
          policy = Path("governance/baseline_integrity_policy.json")
          print("policy_exists", policy.is_file())
          if policy.is_file():
              print("policy", policy.read_text(encoding="utf-8").strip())
          PY
            echo '```'
          } > /tmp/baseline-comment.md
          head -c 60000 /tmp/baseline-comment.md > /tmp/baseline-comment-trimmed.md
          mv /tmp/baseline-comment-trimmed.md /tmp/baseline-comment.md
          wc -c /tmp/baseline-comment.md
      - name: Comment on PR 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment 45 --repo "$GITHUB_REPOSITORY" --body-file /tmp/baseline-comment.md
      - name: Remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p0-baseline-diagnostics.yml
          git commit -m "chore(ci): remove one-shot baseline diagnostics workflow"
          git push origin HEAD:fix/p0-atomic-review-export-20260909
