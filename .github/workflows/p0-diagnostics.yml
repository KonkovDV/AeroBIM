name: One-shot P0 diagnostics

on:
  push:
    branches:
      - "fix/p0-atomic-review-export-20260909"

permissions:
  contents: write
  pull-requests: write

# Temporary helper: publishes the repository gate output for the P0 branch and
# then deletes itself. It asserts nothing about customer acceptance or accuracy.
jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/p0-atomic-review-export-20260909
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked toolchain
        working-directory: backend
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip install -e . --no-deps
      - name: Collect gate output
        working-directory: backend
        shell: bash
        run: |
          log=/tmp/p0-diagnostics.txt
          : > "$log"
          record() {
            echo "== $* ==" >> "$log"
            set +e
            "$@" >> "$log" 2>&1
            echo "exit=$?" >> "$log"
            set -e
            echo >> "$log"
          }
          record python -m ruff format --check src tests
          record python -m ruff check src tests
          record python -m mypy src/aerobim --strict --ignore-missing-imports
          record python -m pytest tests/test_build_customer_review_pack.py -q
      - name: Publish gate output as a pull request comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "One-shot P0 gate output for commit ${GITHUB_SHA}."
            echo
            echo '```text'
            head -c 50000 /tmp/p0-diagnostics.txt
            echo '```'
          } > /tmp/p0-comment.md
          gh pr comment 45 --repo "$GITHUB_REPOSITORY" --body-file /tmp/p0-comment.md
      - name: Delete this one-shot workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p0-diagnostics.yml
          git commit -m "chore(ci): remove the one-shot P0 diagnostics workflow"
          git push origin HEAD:fix/p0-atomic-review-export-20260909
