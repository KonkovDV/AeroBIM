name: Integrate durable worker

on:
  push:
    branches: [main]
    paths: [.github/workflows/integrate-durable-worker.yml]

permissions:
  contents: write

concurrency:
  group: integrate-durable-worker-main
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply the verified PR 87 tree onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/pull/87/head:refs/remotes/origin/pr87
          git diff --binary 4c9550ff59887ad0ec6635eb0af5a566a67b702d..origin/pr87 > /tmp/worker.patch
          git apply --3way --index /tmp/worker.patch || true
          python - <<'PY'
          from pathlib import Path

          def resolve_submit_conflict(path: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              while "<<<<<<< ours\n" in text:
                  before, rest = text.split("<<<<<<< ours\n", 1)
                  ours, rest = rest.split("=======\n", 1)
                  theirs, after = rest.split(">>>>>>> theirs\n", 1)
                  if "/v1/analyze/project-package/submit" not in ours + theirs:
                      raise SystemExit(f"unexpected conflict in {path}")
                  text = before + theirs + after
              p.write_text(text, encoding="utf-8")

          resolve_submit_conflict("README.md")
          resolve_submit_conflict("README.en.md")
          PY
          unresolved="$(git diff --name-only --diff-filter=U)"
          test -z "$unresolved" || { echo "unexpected conflicts: $unresolved"; exit 1; }
          git add README.md README.en.md
      - name: Harden malformed payload handling and synchronize current-main wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "README.md",
              "Required outside development/test for the job record store and shared rate limits. `submit` still executes in the API process; Redis is not a separate worker",
              "Required outside development/test for job records, the reliable ready/processing queue, and shared rate limits. `submit` publishes to Redis; dedicated `aerobim.worker` executes with at-least-once delivery",
          )
          replace(
              "README.en.md",
              "Required outside development/test for the job record store and shared rate limits. `submit` still executes in the API process; Redis is not a separate worker",
              "Required outside development/test for job records, the reliable ready/processing queue, and shared rate limits. `submit` publishes to Redis; the dedicated `aerobim.worker` executes with at-least-once delivery",
          )
          replace(
              ".github/SECURITY.md",
              "IfcOpenShell runs in the API process (IFC-ISO-01, 1.5 GB disk band). Pdfium uses a process isolate + POSIX rlimit / Windows Job Object (PROC-01 closed; Job-create failure falls back to timeout).",
              "Production async IfcOpenShell runs in the dedicated worker container (IFC-ISO-01, 1.5 GB disk band); the synchronous API path remains available outside production compose. Pdfium uses a process isolate + POSIX rlimit / Windows Job Object (PROC-01 closed; Job-create failure falls back to timeout).",
          )
          replace(
              "docs/KNOWN_BUGS.md",
              "| IFC-ISO-01 | IfcOpenShell opens in the API process (1.5 GB disk band). Pdfium crop and pdfminer drawing extract run in a child process with wall-clock kill. Windows Job Object is CPU/memory, not a network jail. | Crash/OOM ≠ silent `summary.passed=true`. Not MEP delivered. |",
              "| IFC-ISO-01 | Production async IfcOpenShell runs in a dedicated long-lived worker container (1.5 GB disk band); the synchronous API path is disabled by production compose. Pdfium crop and pdfminer drawing extract run in a child process with wall-clock kill. | Worker limits are not a fresh per-job sandbox. Crash/OOM ≠ silent `summary.passed=true`. Not MEP delivered. |",
          )
          replace(
              "backend/src/aerobim/application/use_cases/analyze_job_recovery.py",
              "This does not move IFC parsing out of the API process and does not prove a\ncustomer pack, an external CDE import, or production OIDC. It only requeues\njobs that failed because the runner disappeared before a report id was stored.\n",
              "This helper is transport-agnostic; production invokes equivalent recovery from the\ndedicated worker. It does not prove a customer pack, external CDE import, or\nproduction OIDC. It only requeues jobs abandoned before a report id was stored.\n",
          )
          replace(
              "backend/src/aerobim/application/use_cases/analyze_project_package_jobs.py",
              "        # Opportunistic reclaim before concurrency accounting / create.\n        # JOB-01: QUEUED rows whose runner never started (API process died) fail closed.\n",
              "        # Opportunistic reclaim before concurrency accounting / create.\n        # QUEUED rows whose delivery never reached a worker fail closed after the TTL.\n",
          )
          replace(
              "backend/src/aerobim/infrastructure/adapters/redis_analyze_job_queue.py",
              "    def decode_request(cls, raw: str) -> ValidationRequest:\n        item: dict[str, Any] = json.loads(raw)\n        requirement = dict(item.pop(\"requirement_source\"))\n",
              "    def decode_request(cls, raw: str) -> ValidationRequest:\n        decoded: object = json.loads(raw)\n        if not isinstance(decoded, dict):\n            raise ValueError(\"analyze request payload must be a JSON object\")\n        item: dict[str, Any] = dict(decoded)\n        requirement_raw = item.pop(\"requirement_source\")\n        if not isinstance(requirement_raw, dict):\n            raise ValueError(\"requirement_source must be a JSON object\")\n        requirement = dict(requirement_raw)\n",
          )
          replace(
              "backend/src/aerobim/infrastructure/adapters/redis_analyze_job_queue.py",
              "        except (KeyError, TypeError, ValueError) as exc:\n            raise AnalyzeQueuePayloadError(job_id, \"malformed JSON request\") from exc\n",
              "        except (AttributeError, KeyError, TypeError, ValueError) as exc:\n            raise AnalyzeQueuePayloadError(job_id, \"malformed JSON request\") from exc\n",
          )
          queue_test = Path("backend/tests/test_redis_analyze_job_queue.py")
          queue_test.write_text(
              queue_test.read_text(encoding="utf-8")
              + "\n\n@pytest.mark.parametrize(\"payload\", [\"null\", \"[]\", '\"string\"', '{\"requirement_source\": []}'])\n"
                "def test_reserve_rejects_non_object_or_malformed_request(payload: str) -> None:\n"
                "    fake = _FakeRedis(reserved=\"job-malformed\", payload=payload)\n"
                "    with pytest.raises(AnalyzeQueuePayloadError) as caught:\n"
                "        _queue(fake).reserve()\n"
                "    assert caught.value.job_id == \"job-malformed\"\n",
              encoding="utf-8",
          )
          replace(
              "backend/tests/test_task_numbering_unverified.py",
              "        self.assertIn(\"автоматизированной верификации проектной и рабочей документации\", readme)\n        self.assertIn(\"заказчик канала\", readme)\n",
              "        self.assertIn(\"автоматическая проверка проектной и рабочей документации\", readme)\n",
          )
          replace(
              "backend/tests/test_task_numbering_unverified.py",
              "        self.assertIn(\n            \"автоматизированной верификации проектной и рабочей документации\", application\n        )\n        self.assertNotIn",
              "        self.assertIn(\n            \"автоматизированной верификации проектной и рабочей документации\", application\n        )\n        self.assertIn(\"заказчика канала\", application)\n        self.assertNotIn",
          )
          PY
      - uses: actions/setup-python@a8470cfc521f5c749e0c663f53a6d5ecf6b4a931 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev-lock.txt
      - name: Verify integration
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==25.2
          python -m pip install --require-hashes -r backend/requirements-dev-lock.txt
          python -m pip install --no-deps -e backend
          cd backend
          ruff check src tests
          ruff format --check src tests
          mypy src
          pytest -q
          cd ..
          AEROBIM_API_BEARER_TOKEN=test AEROBIM_API_TENANT_ID=test AEROBIM_REDIS_PASSWORD=test docker compose -f docker-compose.production.yml config --quiet
          git diff --check
      - name: Commit integration and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/integrate-durable-worker.yml
          git add -A
          git commit -m "feat(worker): integrate durable IFC execution on main" -m "Move queued package analysis out of the API process into a dedicated Redis-backed worker with retained deliveries, lease fencing, bounded recovery, deterministic report identity, hardened compose isolation, and synchronized evidence. Preserve the latest jury wording and reject malformed reserved payloads fail-closed."
          git push origin HEAD:main
