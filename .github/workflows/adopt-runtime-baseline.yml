name: Adopt CI runtime baseline
on:
  push:
    branches: [audit/analyze-job-recovery]
    paths: [.github/workflows/adopt-runtime-baseline.yml]
permissions:
  actions: read
  contents: write
jobs:
  adopt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adopt generated evidence and remove bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35658840115 --repo KonkovDV/AeroBIM --name ci-runtime-baseline --dir /tmp/baseline
          cp /tmp/baseline/runtime-baseline-latest.ci-generated.json docs/evidence/runtime-baseline-latest.json
          git rm .github/workflows/adopt-runtime-baseline.yml
          git add docs/evidence/runtime-baseline-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(evidence): adopt CI-attested runtime baseline'
          git push
