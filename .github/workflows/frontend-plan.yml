name: Frontend plan gates

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docs/quality/FRONTEND_DEVELOPMENT_PLAN_2026_09.md"
      - "scripts/lint_claims.py"
      - ".github/workflows/frontend-plan.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docs/quality/FRONTEND_DEVELOPMENT_PLAN_2026_09.md"
      - "scripts/lint_claims.py"
      - ".github/workflows/frontend-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

# Also validates stacked WP branches; the existing main CI remains unchanged.
# Machine checks do not replace export artifacts or the offline laptop rehearsal.
jobs:
  frontend-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  backend-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install existing locked toolchain
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip install -e . --no-deps
      - uses: ./.github/actions/materialize-kitchen-denylist
        env:
          AEROBIM_KITCHEN_DENYLIST_B64: ${{ secrets.AEROBIM_KITCHEN_DENYLIST_B64 }}
          AEROBIM_KITCHEN_HMAC_KEY: ${{ secrets.AEROBIM_KITCHEN_HMAC_KEY }}
      - run: python ../scripts/lint_claims.py
      - run: python ../scripts/lint_claims.py --full-docs
      - run: python ../scripts/lint_claims.py --matrix-guard
      - run: python ../scripts/lint_claims.py --claim-boundary-guard
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy src/aerobim --strict --ignore-missing-imports
      - run: python -m pytest tests -q --tb=short
      - name: Remove temporary publication-gate material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP:?}/aerobim-kitchen/denylist.txt" \
            "${RUNNER_TEMP:?}/aerobim-kitchen/hmac.key"
