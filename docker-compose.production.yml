# Shared / LAN stack with required secrets — not production OIDC BFF / SSO (POST-05).
# Usage:
#   set AEROBIM_API_BEARER_TOKEN=<long-random>
#   set AEROBIM_REDIS_PASSWORD=<url-safe-secret>
#   docker compose -f docker-compose.production.yml up --build
#
# Never commit real tokens. Prefer OIDC in real deployments (AEROBIM_OIDC_*).
# Phase 3 BFF lab flags (AEROBIM_OIDC_BFF_*) must stay unset here.
# AEROBIM_REDIS_PASSWORD is compose-only (interpolated into AEROBIM_REDIS_URL).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M
    ports:
      # Bind loopback only — LAN exposure requires an explicit reverse proxy (RT A04).
      - "127.0.0.1:8080:8080"
    environment:
      AEROBIM_ENV: production
      AEROBIM_SIGNOFF_PROFILE: ${AEROBIM_SIGNOFF_PROFILE:-production}
      AEROBIM_HOST: "0.0.0.0"
      AEROBIM_PORT: "8080"
      AEROBIM_DEBUG: "false"
      AEROBIM_STORAGE_DIR: /data/reports
      AEROBIM_CORS_ORIGINS: ${AEROBIM_CORS_ORIGINS:-}
      # Compose fails fast if the variable is missing — no default token.
      AEROBIM_API_BEARER_TOKEN: ${AEROBIM_API_BEARER_TOKEN:?Set AEROBIM_API_BEARER_TOKEN to a long random secret}
      AEROBIM_ALLOW_ANONYMOUS_DEV: "false"
      AEROBIM_REDIS_URL: redis://:${AEROBIM_REDIS_PASSWORD:?Set AEROBIM_REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_started
    volumes:
      - reports-data:/data/reports
      - ./samples:/data/samples:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${AEROBIM_REDIS_PASSWORD:?}",
      ]
    volumes:
      - redis-data:/data

volumes:
  reports-data:
  redis-data:
